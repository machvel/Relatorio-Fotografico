<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#3f5a8c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Relatórios fotográficos</title>
<style>
:root{--blue:#3f5a8c;--blue2:#4472c4;--orange:#ff6a00;--navy:#1f2f4f;--bg:#f3f6fb;--line:#d5dce8;--txt:#1f2f4f;--mut:#5b6577;--ok-bg:#eaf3de;--ok:#27500a;--warn-bg:#faeeda;--warn:#633806;--acc-bg:#e6f1fb;--acc:#0c447c;--err:#a32d2d}
*{box-sizing:border-box}
body{margin:0;font-family:Calibri,"Segoe UI",system-ui,sans-serif;color:var(--txt);background:var(--bg);font-size:15px}
button,input,select,textarea{font:inherit;color:inherit}
button{background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 14px;cursor:pointer}
button:hover{border-color:var(--blue)}
button.pri{background:var(--blue);border-color:var(--blue);color:#fff}
button.pri:hover{background:var(--navy)}
button.dng{color:var(--err)}
button:disabled{opacity:.6;cursor:wait}
input,select,textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 10px;background:#fff}
textarea{min-height:90px;resize:vertical}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
#app{display:grid;grid-template-columns:290px minmax(0,1fr);min-height:100vh}
#side{background:#fff;border-right:1px solid var(--line);padding:16px;display:flex;flex-direction:column;gap:10px}
#side h1{font-size:18px;margin:0;color:var(--blue)}
.item{display:block;width:100%;text-align:left;padding:10px 12px;border-radius:8px}
.item.sel{border:2px solid var(--blue2);padding:9px 11px;background:var(--acc-bg)}
.item b{display:block;font-size:15px;font-weight:600}
.item span{font-size:12px;color:var(--mut)}
#main{padding:20px;min-width:0}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 18px;max-width:880px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.lbl{font-size:12px;color:var(--mut);margin:0}
.val{margin:0 0 10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px;border-top:1px solid var(--line);padding-top:12px;margin-top:12px}
.chip{display:inline-block;background:var(--bg);border-radius:8px;padding:4px 10px;margin:0 6px 6px 0;font-size:13px}
.ph{width:100%;aspect-ratio:16/9;background:var(--bg);border:1px solid var(--line);border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--mut);overflow:hidden;margin-top:12px}
.ph img{width:100%;height:100%;object-fit:contain;background:#000}
.badge{font-size:12px;font-weight:600;border-radius:8px;padding:4px 12px}
.b-Antes{background:var(--warn-bg);color:var(--warn)}
.b-Durante{background:var(--acc-bg);color:var(--acc)}
.b-Depois{background:var(--ok-bg);color:var(--ok)}
.ok{background:var(--ok-bg);color:var(--ok);border-radius:8px;padding:9px 12px;margin-bottom:12px;font-size:14px}
.err{color:var(--err);font-size:13px;margin:6px 0 0}
.empty{text-align:center;color:var(--mut);padding:40px 10px}
.back{display:none}
.hr{border-top:1px solid var(--line);margin:14px 0}
@media(max-width:799px){
#app{display:block}
#app #main{display:none}
#app.detail #side{display:none}
#app.detail #main{display:block}
.back{display:inline-block;margin-bottom:12px}
#main{padding:12px}
.grid2{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div id="app">
  <aside id="side"></aside>
  <main id="main"></main>
</div>
<input id="file" type="file" accept="image/*" capture="environment" hidden>
<script>
var S={reports:[]},sel=null,pg=0,mode="view",pending=null,msg="",err="",busy=false;
var PHASES=["Antes","Durante","Depois"];
var PDF_URL="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js";

var dbp=null;
function openDb(){
  if(dbp){return dbp}
  dbp=new Promise(function(res,rej){
    var q=indexedDB.open("bram-relatorios",2);
    q.onupgradeneeded=function(){
      var d=q.result;
      if(!d.objectStoreNames.contains("kv")){d.createObjectStore("kv")}
      if(!d.objectStoreNames.contains("img")){d.createObjectStore("img")}
    };
    q.onsuccess=function(){res(q.result)};
    q.onerror=function(){rej(q.error)};
  });
  return dbp;
}
function dbGet(store,key){
  return openDb().then(function(d){return new Promise(function(res){
    var r=d.transaction(store).objectStore(store).get(key);
    r.onsuccess=function(){res(r.result)};
    r.onerror=function(){res(null)};
  })}).catch(function(){return null});
}
function dbPut(store,key,val){
  return openDb().then(function(d){return new Promise(function(res){
    var t=d.transaction(store,"readwrite");t.objectStore(store).put(val,key);
    t.oncomplete=res;t.onerror=res;
  })}).catch(function(){});
}
function dbDel(store,key){
  return openDb().then(function(d){return new Promise(function(res){
    var t=d.transaction(store,"readwrite");t.objectStore(store).delete(key);
    t.oncomplete=res;t.onerror=res;
  })}).catch(function(){});
}
function persist(){return dbPut("kv","state",S)}

var imgCache={};
function getImg(id){
  if(imgCache[id]){return Promise.resolve(imgCache[id])}
  return dbGet("img",id).then(function(rec){if(rec){imgCache[id]=rec}return rec});
}

var pdfLib=null;
function loadPdfLib(){
  if(window.jspdf&&window.jspdf.jsPDF){return Promise.resolve()}
  if(pdfLib){return pdfLib}
  pdfLib=new Promise(function(res,rej){
    var s=document.createElement("script");
    s.src=PDF_URL;s.onload=res;
    s.onerror=function(){pdfLib=null;rej(new Error("pdf"))};
    document.head.appendChild(s);
  });
  return pdfLib;
}

function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function cur(){for(var i=0;i<S.reports.length;i++){if(S.reports[i].id===sel){return S.reports[i]}}return null}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function slug(t){return String(t).replace(/[^A-Za-z0-9]+/g,"_").replace(/^_|_$/g,"")}

function renderSide(){
  var h='<h1>Relatórios</h1><button class="pri" data-act="new">Novo relatório</button>';
  if(!S.reports.length){h+='<p class="lbl">Nenhum relatório ainda.</p>'}
  S.reports.forEach(function(r){
    h+='<button class="item'+(r.id===sel?' sel':'')+'" data-act="open" data-id="'+r.id+'"><b>'+esc(r.title)+'</b><span>'+esc(r.turma)+' · '+esc(r.periodo||"sem período")+' · '+r.pages.length+' fotos</span></button>';
  });
  document.getElementById("side").innerHTML=h;
}

function headerForm(r,isNew){
  var h='<p style="font-size:18px;font-weight:600;margin:0 0 4px">'+(isNew?"Novo relatório":"Editar cabeçalho")+'</p>';
  h+='<label>Nome do relatório</label><input id="f-title" value="'+esc(r.title)+'" placeholder="Base dos MCP\'s">';
  if(err){h+='<p class="err">'+esc(err)+'</p>'}
  h+='<label>Embarcação</label><input id="f-vessel" value="'+esc(r.vessel)+'">';
  h+='<label>Turma</label><input id="f-turma" value="'+esc(r.turma)+'" placeholder="Turma B">';
  h+='<label>CMT | CFM</label><input id="f-cmt" value="'+esc(r.cmt)+'" placeholder="CMT Nome | CFM Nome">';
  h+='<label>Setor</label><input id="f-setor" value="'+esc(r.setor)+'">';
  h+='<label>Período</label><input id="f-periodo" value="'+esc(r.periodo)+'" placeholder="26 out a 01 nov">';
  h+='<label>Colaboradores (um por linha)</label><textarea id="f-col" placeholder="CFM Nome Sobrenome">'+esc(r.colaboradores.join("\n"))+'</textarea>';
  h+='<div class="btns" style="margin-top:14px;justify-content:flex-end"><button data-act="cancel">Cancelar</button><button class="pri" data-act="save-header">Salvar</button></div>';
  return h;
}

function hydrate(){
  document.querySelectorAll("img[data-pid]").forEach(function(im){
    getImg(im.getAttribute("data-pid")).then(function(rec){
      if(rec&&im.isConnected){im.src=rec.thumb}
    });
  });
}

function renderMain(){
  var el=document.getElementById("main"),r=cur(),h="";
  if(mode==="newReport"){
    el.innerHTML='<div class="card">'+headerForm({title:"",vessel:"BRAM POWER",turma:"",cmt:"",setor:"Máquinas",periodo:"",colaboradores:[]},true)+'</div>';
    return;
  }
  if(!r){
    el.innerHTML='<div class="card empty"><p style="font-size:18px;font-weight:600;color:var(--txt);margin:0 0 6px">Selecione um relatório</p><p style="margin:0 0 14px">Escolha um da lista ou crie o primeiro.</p><button class="pri" data-act="new">Novo relatório</button></div>';
    return;
  }
  if(mode==="editHeader"){
    el.innerHTML='<div class="card">'+headerForm(r,false)+'</div>';
    return;
  }
  h+='<button class="back" data-act="back">Voltar à lista</button>';
  h+='<div class="card">';
  if(msg){h+='<div class="ok">'+esc(msg)+'</div>'}
  h+='<div class="row"><div><p style="font-size:20px;font-weight:600;margin:0">'+esc(r.title)+'</p><p class="lbl">'+esc(r.vessel)+' · '+esc(r.turma)+' · '+esc(r.setor)+'</p></div>';
  h+='<div class="btns"><button data-act="edit">Editar</button><button class="pri" data-act="pdf"'+(busy?' disabled':'')+'>'+(busy?'Gerando…':'Exportar PDF')+'</button></div></div>';
  h+='<div class="grid2"><div><p class="lbl">CMT | CFM</p><p class="val">'+esc(r.cmt||"-")+'</p></div><div><p class="lbl">Período</p><p class="val">'+esc(r.periodo||"-")+'</p></div></div>';
  h+='<p class="lbl">Colaboradores</p><div>'+(r.colaboradores.length?r.colaboradores.map(function(c){return '<span class="chip">'+esc(c)+'</span>'}).join(""):'<span class="lbl">Nenhum colaborador informado.</span>')+'</div>';
  h+='<div class="hr"></div>';
  if(mode==="addPhoto"&&pending){
    h+='<p style="font-size:16px;font-weight:600;margin:0 0 4px">Nova foto</p>';
    h+='<div class="ph"><img alt="Foto nova" src="'+pending.thumb+'"></div>';
    var last=r.pages.length?r.pages[r.pages.length-1]:{task:"",phase:"Antes"};
    h+='<label>Descrição da tarefa</label><input id="p-task" value="'+esc(last.task)+'" placeholder="Shock Fast das bases do ME#1 - base 1BB">';
    if(err){h+='<p class="err">'+esc(err)+'</p>'}
    h+='<label>Fase</label><select id="p-phase">'+PHASES.map(function(p){return '<option'+(p===last.phase?' selected':'')+'>'+p+'</option>'}).join("")+'</select>';
    h+='<div class="btns" style="margin-top:14px;justify-content:flex-end"><button data-act="cancel-photo">Cancelar</button><button class="pri" data-act="save-photo">Salvar foto</button></div>';
  }else if(!r.pages.length){
    h+='<div class="empty"><p style="margin:0 0 12px">Este relatório ainda não tem fotos.</p><button class="pri" data-act="photo">Tirar ou escolher foto</button></div>';
  }else{
    if(pg>=r.pages.length){pg=r.pages.length-1}
    var p=r.pages[pg];
    h+='<div class="ph"><img alt="'+esc(p.task)+'" data-pid="'+p.id+'"></div>';
    h+='<div class="row" style="margin-top:12px"><div><p style="font-weight:600;margin:0">'+esc(p.task)+'</p><p class="lbl">Página '+(pg+1)+' de '+r.pages.length+'</p></div><span class="badge b-'+p.phase+'">'+p.phase+'</span></div>';
    h+='<div class="row" style="margin-top:12px"><button data-act="prev" aria-label="Página anterior">&larr;</button><div class="btns"><button class="pri" data-act="photo">Adicionar foto</button><button class="dng" data-act="del-page">Excluir página</button></div><button data-act="next" aria-label="Próxima página">&rarr;</button></div>';
  }
  h+='<div class="hr"></div><button class="dng" data-act="del-report">Excluir relatório</button>';
  h+='</div>';
  el.innerHTML=h;
  hydrate();
}

function render(){
  document.getElementById("app").className=(sel||mode==="newReport")?"detail":"";
  renderSide();renderMain();
}

function toJpeg(im,maxW,q){
  var w=im.width,h=im.height;
  if(w>maxW){h=Math.round(h*maxW/w);w=maxW}
  var c=document.createElement("canvas");c.width=w;c.height=h;
  c.getContext("2d").drawImage(im,0,0,w,h);
  return {data:c.toDataURL("image/jpeg",q),w:w,h:h};
}
function compress(file){
  return new Promise(function(res,rej){
    var url=URL.createObjectURL(file),im=new Image();
    im.onload=function(){
      var full=toJpeg(im,1100,0.75),th=toJpeg(im,720,0.7);
      URL.revokeObjectURL(url);
      res({full:full.data,thumb:th.data,w:full.w,h:full.h});
    };
    im.onerror=function(){URL.revokeObjectURL(url);rej()};
    im.src=url;
  });
}

function val(id){return document.getElementById(id).value.trim()}

function makePdf(r,fulls){
  var d=new window.jspdf.jsPDF({orientation:"landscape",unit:"pt",format:[780,540]});
  function bars(){
    d.setFillColor(255,106,0);d.rect(762,0,18,125,"F");
    d.setFillColor(63,90,140);d.rect(762,125,18,415,"F");
  }
  function heading(t,y){d.setFont("helvetica","bold");d.setFontSize(22);d.setTextColor(68,114,196);d.text(t,60,y)}
  bars();
  d.setDrawColor(68,114,196);d.setLineWidth(1);d.rect(40,30,640,80);
  d.setFont("helvetica","bold");d.setFontSize(22);d.setTextColor(31,47,79);
  d.text("Relatório Fotográfico - "+r.title,360,78,{align:"center",maxWidth:600});
  var rows=[["Embarcação:",r.vessel],["Turma:",r.turma],["CMT || CFM:",r.cmt],["Setor:",r.setor],["Período:",r.periodo||"-"]];
  rows.forEach(function(row,i){
    var y=150+i*46;
    d.setFillColor(i%2?255:232,i%2?255:238,i%2?255:245);d.setDrawColor(213,220,232);d.rect(100,y,520,42,"FD");
    d.setFont("helvetica","bold");d.setFontSize(13);d.setTextColor(31,47,79);d.text(row[0],115,y+26);
    d.setFont("helvetica","normal");d.text(String(row[1]||"-"),250,y+26,{maxWidth:360});
  });
  d.addPage();bars();heading("Colaboradores",70);
  d.setFont("helvetica","normal");d.setFontSize(16);d.setTextColor(31,47,79);
  r.colaboradores.forEach(function(c,i){d.text("•  "+c,80,125+i*30)});
  d.addPage();bars();heading("LISTA DE ATIVIDADES REALIZADAS",70);
  var tasks=[];r.pages.forEach(function(p){if(tasks.indexOf(p.task)<0){tasks.push(p.task)}});
  d.setFont("helvetica","normal");d.setFontSize(12);d.setTextColor(31,47,79);
  var y=115;
  tasks.forEach(function(t){
    var lines=d.splitTextToSize("•  "+t.toUpperCase(),640);
    if(y+lines.length*16>510){d.addPage();bars();y=60}
    d.text(lines,70,y);y+=lines.length*16+6;
  });
  var LBL={Antes:"ANTES DA ATIVIDADE",Durante:"DURANTE A ATIVIDADE",Depois:"DEPOIS DA ATIVIDADE"};
  r.pages.forEach(function(p,i){
    var rec=fulls[i];
    d.addPage();bars();
    d.setFont("helvetica","normal");d.setFontSize(30);d.setTextColor(68,114,196);d.text("REGISTRO FOTOGRÁFICO",50,52);
    d.setDrawColor(68,114,196);d.setLineWidth(1.5);d.line(50,64,740,64);
    d.setLineWidth(1);d.rect(120,78,520,36);
    d.setFont("helvetica","bold");d.setFontSize(12);d.setTextColor(31,47,79);
    var tl=d.splitTextToSize(p.task.toUpperCase(),500).slice(0,2);
    d.text(tl,380,tl.length>1?93:101,{align:"center"});
    if(rec){
      var bw=600,bh=330,sc=Math.min(bw/p.w,bh/p.h),iw=p.w*sc,ih=p.h*sc,ix=380-iw/2,iy=125+(bh-ih)/2;
      d.addImage(rec.full,"JPEG",ix,iy,iw,ih);
      d.setDrawColor(68,114,196);d.rect(ix,iy,iw,ih);
    }
    d.rect(280,470,200,30);
    d.setFont("helvetica","bold");d.setFontSize(12);d.setTextColor(31,47,79);d.text(LBL[p.phase]||p.phase,380,490,{align:"center"});
  });
  var name="Relatorio_"+slug(r.title)+".pdf";
  d.save(name);
  return name;
}

function exportPdf(r){
  busy=true;msg="";render();
  Promise.all([loadPdfLib(),Promise.all(r.pages.map(function(p){return getImg(p.id)}))]).then(function(a){
    var n=makePdf(r,a[1]);
    busy=false;msg="PDF gerado: "+n;render();
  }).catch(function(){
    busy=false;render();
    alert("Não foi possível gerar o PDF. Se for a primeira vez, conecte à internet para carregar o gerador e tente de novo.");
  });
}

document.addEventListener("click",function(e){
  var b=e.target.closest("[data-act]");if(!b){return}
  var a=b.getAttribute("data-act"),r=cur();
  if(a==="new"){mode="newReport";sel=null;msg="";err=""}
  else if(a==="open"){sel=b.getAttribute("data-id");pg=0;mode="view";msg="";err=""}
  else if(a==="back"){sel=null;mode="view"}
  else if(a==="edit"){mode="editHeader";msg="";err=""}
  else if(a==="cancel"){mode="view";err=""}
  else if(a==="save-header"){
    var t=val("f-title");
    if(!t){err="Digite um nome para o relatório.";render();return}
    var o={title:t,vessel:val("f-vessel"),turma:val("f-turma"),cmt:val("f-cmt"),setor:val("f-setor"),periodo:val("f-periodo"),colaboradores:document.getElementById("f-col").value.split("\n").map(function(x){return x.trim()}).filter(Boolean)};
    if(mode==="newReport"){o.id=uid();o.pages=[];S.reports.unshift(o);sel=o.id;pg=0;msg="Relatório criado"}
    else{for(var k in o){r[k]=o[k]}msg="Cabeçalho salvo"}
    mode="view";err="";persist();
  }
  else if(a==="pdf"){if(busy){return}exportPdf(r);return}
  else if(a==="prev"){pg=(pg-1+r.pages.length)%r.pages.length;msg=""}
  else if(a==="next"){pg=(pg+1)%r.pages.length;msg=""}
  else if(a==="photo"){document.getElementById("file").click();return}
  else if(a==="cancel-photo"){pending=null;mode="view";err=""}
  else if(a==="save-photo"){
    var task=val("p-task");
    if(!task){err="Descreva a tarefa desta foto.";render();return}
    var id=uid();
    var page={id:id,task:task,phase:document.getElementById("p-phase").value,w:pending.w,h:pending.h};
    var rec={full:pending.full,thumb:pending.thumb};
    imgCache[id]=rec;
    r.pages.push(page);
    pg=r.pages.length-1;pending=null;mode="view";err="";msg="Foto salva";
    dbPut("img",id,rec).then(persist);
  }
  else if(a==="del-page"){
    if(!confirm("Excluir esta página do relatório?")){return}
    var gone=r.pages.splice(pg,1)[0];
    delete imgCache[gone.id];dbDel("img",gone.id);
    if(pg>0){pg--}msg="";persist();
  }
  else if(a==="del-report"){
    if(!confirm("Excluir o relatório inteiro? Essa ação não pode ser desfeita.")){return}
    r.pages.forEach(function(p){delete imgCache[p.id];dbDel("img",p.id)});
    S.reports=S.reports.filter(function(x){return x.id!==sel});sel=null;mode="view";msg="";persist();
  }
  render();
});

document.getElementById("file").addEventListener("change",function(ev){
  var f=ev.target.files&&ev.target.files[0];if(!f){return}
  compress(f).then(function(c){pending=c;mode="addPhoto";err="";msg="";render()}).catch(function(){alert("Não foi possível ler essa foto. Tente outra.")});
  ev.target.value="";
});

function migrate(){
  var jobs=[];
  S.reports.forEach(function(r){
    r.pages.forEach(function(p){
      if(p.img){
        var data=p.img;delete p.img;
        jobs.push(dbPut("img",p.id,{full:data,thumb:data}));
      }
    });
  });
  if(jobs.length){return Promise.all(jobs).then(persist)}
  return Promise.resolve();
}

dbGet("kv","state").then(function(v){
  if(v&&v.reports){S=v}
  return migrate();
}).then(function(){
  if(S.reports.length&&window.matchMedia("(min-width:800px)").matches){sel=S.reports[0].id}
  render();
  var idle=window.requestIdleCallback||function(f){setTimeout(f,3000)};
  idle(function(){loadPdfLib().catch(function(){})});
});

if("serviceWorker" in navigator&&/^https?:$/.test(location.protocol)){
  window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})});
}
</script>
</body>
</html>
